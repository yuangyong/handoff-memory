name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装项目
        run: python -m pip install .
      - name: 编译检查
        run: python -m compileall -q src tests
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 依赖一致性检查
        run: python -m pip check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 构建 Wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: 验证 Wheel 安装及入口
        run: |
          python -m pip install dist/*.whl
          handoff-memory --version
          handoff-memory help init | grep -- "--select-tools"
      - name: 验证安装后的跨项目流程
        run: |
          project="${RUNNER_TEMP}/handoff-smoke"
          handoff-memory init "$project" --name "Wheel Smoke" --integrate codex
          test ! -e "$project/AGENTS.md"
          test -f "$project/.agents/skills/session-handoff/SKILL.md"
          handoff-memory integrate codex "$project" --with-rules
          test -f "$project/AGENTS.md"
          interactive_project="${RUNNER_TEMP}/handoff-interactive"
          printf 'all\n' | handoff-memory init "$interactive_project" --select-tools
          test -f "$interactive_project/.agents/skills/session-handoff/SKILL.md"
          test ! -e "$interactive_project/.agents/rules/handoff-memory.md"
          test ! -e "$interactive_project/.github/copilot-instructions.md"
          test -f "$interactive_project/.github/skills/session-handoff/SKILL.md"
          handoff-memory integrate all "$interactive_project" --with-rules
          test -f "$interactive_project/.agents/rules/handoff-memory.md"
          test -f "$interactive_project/.github/copilot-instructions.md"
          test -f "$interactive_project/.trae/rules/project_rules.md"
          test -f "$interactive_project/.trae/skills/session-handoff/SKILL.md"
          test -f "$interactive_project/.qoder/rules/handoff-memory.md"
          test -f "$interactive_project/.qoder/skills/session-handoff/SKILL.md"
          test -f "$interactive_project/.opencode/skills/session-handoff/SKILL.md"
          cp examples/ACTIVE.example.md "$project/.ai-memory/ACTIVE.md"
          handoff-memory check "$project"
          handoff-memory save "$project"
          handoff-memory resume "$project" | grep "当前任务交接"

  svn-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
      - name: 安装项目
        run: python -m pip install .
      - name: 运行 Git/SVN 版本库集成测试
        run: python -m unittest tests.test_repository_state -v
