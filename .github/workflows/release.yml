name: 发布到 PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并验证发行包
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: 确认标签提交属于 main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: 校验标签、版本与变更日志
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          expected_tag = f"v{package_version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"发布标签 {actual_tag} 与包版本 {package_version} 不一致；"
                  f"应使用 {expected_tag}"
              )

          init_text = Path("src/handoff_memory/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if match is None or match.group(1) != package_version:
              raise SystemExit("pyproject.toml 与 handoff_memory.__version__ 不一致")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## \[{re.escape(package_version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md 缺少版本 {package_version} 的正式发布日期")
          PY
      - name: 安装构建与校验工具
        run: python -m pip install build twine
      - name: 运行发行前质量门
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          python scripts/sync_session_handoff_skill.py --check
          python -m pip check
      - name: 构建 Wheel 与源码包
        run: python -m build
      - name: 校验发行包元数据
        run: python -m twine check dist/*
      - name: 验证 Wheel 安装与核心流程
        run: |
          python -m pip install --force-reinstall dist/*.whl
          hmem --version
          hmem help
          project="${RUNNER_TEMP}/hmem-release-smoke"
          hmem init "$project" --name "Release Smoke" --integrate codex
          cp examples/ACTIVE.example.md "$project/.ai-memory/ACTIVE.md"
          hmem check "$project" --strict --format json
          hmem save "$project" --format json
          hmem resume "$project" --format json
          hmem history "$project" --format json
          hmem show latest "$project" --format json
      - name: 保存待发布产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handoff-memory-dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: 使用可信发布上传 PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/handoff-memory
    permissions:
      id-token: write
    steps:
      - name: 下载已验证的发行包
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: handoff-memory-dist-${{ github.ref_name }}
          path: dist
      - name: 上传到 PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
