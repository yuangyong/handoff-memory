name: 功能建议
description: 提议符合本地优先与显式交接边界的新能力
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README、产品规范和路线图。大型功能或公共接口变化应先讨论问题和边界，再开始实现。建议会作为唯一维护者决策的输入，不构成路线图或实现承诺。

  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 描述当前工作流中的具体困难，而不是只给出方案名称。
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 当前替代方式
      description: 说明现有命令、脚本或人工流程为什么不足。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 给出用户可观察行为、示例命令或输出；不需要提前完成全部设计。
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 安全、隐私与兼容性影响
      description: 是否联网、读取敏感数据、改变 CLI/JSON、增加依赖或依赖特定客户端？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和路线图。
          required: true
        - label: 建议不会默认上传交接、执行交接命令或自动保存每轮对话。
          required: true
