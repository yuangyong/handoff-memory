[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-memory"
version = "0.11.0"
description = "本地优先、跨 AI 工具的会话交接记忆 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuangyong", email = "2314042921@qq.com" }]
maintainers = [{ name = "yuangyong", email = "2314042921@qq.com" }]
keywords = ["ai", "memory", "handoff", "codex", "claude", "cursor", "antigravity", "trae", "qoder"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/yuangyong/handoff-memory"
Documentation = "https://github.com/yuangyong/handoff-memory#readme"
Issues = "https://github.com/yuangyong/handoff-memory/issues"
Changelog = "https://github.com/yuangyong/handoff-memory/blob/main/CHANGELOG.md"
Security = "https://github.com/yuangyong/handoff-memory/security/policy"

[project.scripts]
hmem = "handoff_memory.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
handoff_memory = ["assets/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
